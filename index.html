<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャーナリングタイマー</title>
    <script>
    // テーマの決定順は 前回スイッチで選んだ設定 → ?theme= → ダーク。
    // 描画前に確定させてチラつきを防ぐ
    (function () {
        var t;
        try { t = localStorage.getItem('jtimer-theme'); } catch (x) {}
        if (t !== 'dark' && t !== 'light') {
            try {
                var p = new URLSearchParams(location.search).get('theme');
                if (p === 'dark' || p === 'light') t = p;
            } catch (x) {}
        }
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ライト：朝の光。白ではなく、日が差した紙の色 */
        :root {
            --base:      #fdf8f3;
            --card:      #fffdfb;
            --card-run:  rgba(255, 253, 251, 0.82); /* 計測中は下の空の色を少し透かす */
            --edge:      rgba(163, 110, 70, 0.17);
            --edge-str:  rgba(163, 110, 70, 0.27);
            --track:     #f1e2d5;  /* リングの軌道 */
            --accent:    #f97316;  /* 朝日のオレンジ */
            --accent-2:  #ef5f52;  /* リングの始まり側。朝焼けの赤み */
            --fg:        #33221a;
            --fg-mute:   #8a6f5e;
            --btn:       #33221a;
            --btn-fg:    #fdf8f3;
            --input-bg:  #fdf6f0;
            --hover:     rgba(163, 110, 70, 0.07);
            --sw:        #cdb7a5;
        }
        /* ダーク：夜明け前の空 */
        html[data-theme="dark"] {
            --base:      #1a120e;
            --card:      #241a14;
            --card-run:  rgba(30, 20, 15, 0.78);
            --edge:      rgba(255, 190, 150, 0.15);
            --edge-str:  rgba(255, 190, 150, 0.26);
            --track:     #3d2b20;
            --accent:    #ff9a4d;
            --accent-2:  #f2705c;
            --fg:        #f8ece2;
            --fg-mute:   #b39c8c;
            --btn:       #f6e7d9;
            --btn-fg:    #221710;
            --input-bg:  #2c1f18;
            --hover:     rgba(255, 190, 150, 0.08);
            --sw:        #6d5445;
        }

        /* iframeの地色は既定が白なので、テーマの色で必ず塗る */
        html { background: var(--base); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--base);
            padding: 20px;
        }

        .jt-card {
            background: var(--card);
            border: 1px solid var(--edge);
            border-radius: 12px;
            padding: 1rem 1.75rem;
            display: flex;
            align-items: center;
            gap: 1.75rem;
            transition: background 2s ease;
            width: 100%;
            max-width: 680px;
        }

        .jt-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: conic-gradient(var(--accent-2) 0deg, var(--accent) 0deg, var(--track) 0deg);
        }

        .jt-inner {
            width: 60px;
            height: 60px;
            background: var(--card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--edge);
        }

        .jt-time {
            font-size: 16px;
            font-weight: 500;
            color: var(--fg);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .jt-mid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .jt-phase {
            font-size: 11px;
            color: var(--fg-mute);
            line-height: 1.4;
        }

        .jt-divider {
            width: 1px;
            height: 24px;
            background: var(--edge-str);
            flex-shrink: 0;
        }

        .jt-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .jt-sel {
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }

        .jt-label {
            font-size: 11px;
            color: var(--fg-mute);
            white-space: nowrap;
        }

        .jt-input {
            width: 44px;
            font-size: 12px;
            text-align: center;
            padding: 3px 5px;
            border: 1px solid var(--edge-str);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--fg);
            font-family: inherit;
        }

        .jt-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .jt-start {
            background: var(--btn);
            color: var(--btn-fg);
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 18px;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .jt-start:hover { opacity: 0.82; }
        .jt-start:active { transform: scale(0.97); }

        .jt-mini {
            background: none;
            border: 1px solid var(--edge-str);
            border-radius: 5px;
            font-size: 11px;
            color: var(--fg-mute);
            padding: 4px 9px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .jt-mini:hover { background: var(--hover); }

        /* ライト・ダークの切り替えスイッチ */
        .jt-tg {
            position: relative;
            width: 30px;
            height: 17px;
            margin-left: 4px;
            padding: 0;
            flex-shrink: 0;
            border: 1px solid var(--sw);
            border-radius: 9px;
            background: none;
            cursor: pointer;
            opacity: 0.45;
            -webkit-appearance: none;
            appearance: none;
            transition: opacity 0.18s;
        }
        .jt-tg:hover, .jt-tg:focus-visible { opacity: 1; }
        .jt-tg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .jt-tg i {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--sw);
            transition: transform 0.22s cubic-bezier(0.3, 0.9, 0.4, 1);
        }
        html[data-theme="dark"] .jt-tg i { transform: translateX(13px); }

        @media (prefers-reduced-motion: reduce) {
            .jt-tg i { transition: none; }
            .jt-card { transition: none; }
        }
    </style>
</head>
<body>

<div class="jt-card" id="jt-card">

    <div class="jt-ring" id="jt-ring">
        <div class="jt-inner">
            <span class="jt-time" id="jt-time">10:00</span>
        </div>
    </div>

    <div class="jt-mid">
        <div class="jt-phase" id="jt-phase">深呼吸をして準備を整えましょう</div>
    </div>

    <div class="jt-divider"></div>

    <div class="jt-right">
        <div class="jt-sel" id="jt-sel">
            <input type="number" class="jt-input" id="jt-input" value="10" min="1" max="60" onchange="jtUpdate()">
            <span class="jt-label">分</span>
        </div>
        <button class="jt-start" onclick="jtStart()">スタート</button>
        <button class="jt-mini" onclick="jtStop()">ストップ</button>
        <button class="jt-mini" onclick="jtReset()">リセット</button>
        <button class="jt-tg" id="jt-tg" type="button" role="switch" aria-checked="true" aria-label="ライト・ダークの切り替え"><i></i></button>
    </div>

</div>

<script>
    let jt_iv, jt_rem = 600, jt_run = false, jt_total = 600;
    const $ = id => document.getElementById(id);
    const root = document.documentElement;

    // 配色はCSS変数から読む。テーマを切り替えたら値が変わるので、その都度読み直す
    const C = n => getComputedStyle(root).getPropertyValue(n).trim();

    // 空の色。夜明け前 → 朝焼け → 陽が昇る の4段階をテーマごとに持つ
    const SKY = {
        light: [['#fdf8f3', '#f7ece1'], ['#fff3e9', '#ffe0c8'], ['#fff0e0', '#ffd3b0'], ['#fff2e2', '#ffc796']],
        dark:  [['#1a120e', '#241611'], ['#2e1710', '#48200f'], ['#44230f', '#603512'], ['#573619', '#7c4d1f']]
    };

    function jtFmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

    function jtUpdate() {
        if (!jt_run) { jt_total = (parseInt($('jt-input').value) || 10) * 60; jt_rem = jt_total; jtDraw(); }
    }

    // 進んだぶんの弧を、朝焼けの赤みから朝日のオレンジへ流す
    function jtRing(deg) {
        return 'conic-gradient(' + C('--accent-2') + ' 0deg, ' + C('--accent') + ' ' + deg + 'deg, ' + C('--track') + ' ' + deg + 'deg)';
    }

    function jtDraw() {
        $('jt-time').textContent = jtFmt(jt_rem);
        $('jt-ring').style.background = jtRing(((jt_total - jt_rem) / jt_total) * 360);
        jtPhase();
    }

    function jtPhase() {
        const p = (jt_total - jt_rem) / jt_total;
        jtBg(p);
        if (!jt_run) return;
        $('jt-phase').textContent = ['心を静めて、思考を整理しましょう', '自由に思考を流れるままに表現してください', '深い洞察や気づきを大切に記録しましょう', 'もうすぐ完了です。最後の思考をまとめましょう'][p < 0.25 ? 0 : p < 0.5 ? 1 : p < 0.75 ? 2 : 3];
    }

    function lerp(c1, c2, f) {
        const h1 = c1.replace('#', ''), h2 = c2.replace('#', '');
        return '#' + [0, 2, 4].map(i => {
            const v = Math.round(parseInt(h1.substr(i, 2), 16) + (parseInt(h2.substr(i, 2), 16) - parseInt(h1.substr(i, 2), 16)) * f);
            return v.toString(16).padStart(2, '0');
        }).join('');
    }

    // 進むにつれて空が明けていく
    function jtBg(p) {
        const s = SKY[root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'];
        let i, lp;
        if (p <= 0.33) { i = 0; lp = p / 0.33; }
        else if (p <= 0.66) { i = 1; lp = (p - 0.33) / 0.33; }
        else { i = 2; lp = (p - 0.66) / 0.34; }
        const t = lerp(s[i][0], s[i + 1][0], lp), b = lerp(s[i][1], s[i + 1][1], lp);
        document.body.style.background = 'linear-gradient(135deg,' + t + ' 0%,' + b + ' 100%)';
        $('jt-card').style.background = C('--card-run');
    }

    function jtStart() {
        if (!jt_run) {
            jt_run = true;
            $('jt-input').disabled = true;
            const s = $('jt-sel'); s.style.opacity = '0.35'; s.style.pointerEvents = 'none';
            jt_iv = setInterval(() => { jt_rem--; jtDraw(); if (jt_rem <= 0) jtComplete(); }, 1000);
            jtPhase();
        }
    }

    function jtStop() {
        if (jt_run) {
            jt_run = false;
            clearInterval(jt_iv);
            $('jt-phase').textContent = '一時停止中 — スタートで再開';
        }
    }

    function jtReset() {
        jt_run = false; clearInterval(jt_iv);
        $('jt-input').disabled = false;
        const s = $('jt-sel'); s.style.opacity = '1'; s.style.pointerEvents = 'auto';
        jt_total = (parseInt($('jt-input').value) || 10) * 60; jt_rem = jt_total;
        $('jt-phase').textContent = '深呼吸をして準備を整えましょう';
        jtIdlePaint();
    }

    // カウントを進めずに、今のテーマの色で塗り直す
    function jtIdlePaint() {
        $('jt-time').textContent = jtFmt(jt_rem);
        $('jt-ring').style.background = jtRing(((jt_total - jt_rem) / jt_total) * 360);
        document.body.style.background = C('--base');
        $('jt-card').style.background = C('--card');
    }

    function jtComplete() {
        jt_run = false; clearInterval(jt_iv);
        $('jt-phase').textContent = 'お疲れさまでした。素晴らしいジャーナリングでした';
        const s = $('jt-sel'); s.style.opacity = '1'; s.style.pointerEvents = 'auto';
        $('jt-input').disabled = false;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [440, 523.25, 659.25, 783.99].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.setValueAtTime(f, ctx.currentTime); o.type = 'sine';
                const d = i * 0.15, v = 0.08 - i * 0.015;
                g.gain.setValueAtTime(0, ctx.currentTime + d);
                g.gain.linearRampToValueAtTime(v, ctx.currentTime + d + 0.2);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 2.5);
                o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 2.5);
            });
        } catch (e) {}
    }

    // テーマ切り替え。選んだ結果は次に開いたときも残す
    function jtMarkTheme() {
        const dark = root.getAttribute('data-theme') !== 'light';
        $('jt-tg').setAttribute('aria-checked', dark ? 'true' : 'false');
        $('jt-tg').title = dark ? 'ライトモードにする' : 'ダークモードにする';
    }

    $('jt-tg').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        jtMarkTheme();
        try { localStorage.setItem('jtimer-theme', next); } catch (x) {}
        // 計測中はその時点の空の色で、止まっているときは待機の色で塗り直す
        if (jt_run) jtDraw(); else jtIdlePaint();
    });

    jtMarkTheme();
    jtIdlePaint();
</script>

</body>
</html>
