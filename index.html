<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャーナリングタイマー</title>
    <script>
    // テーマの決定順は 前回スイッチで選んだ設定 → ?theme= → ダーク。
    // 描画前に確定させてチラつきを防ぐ
    (function () {
        var t;
        try { t = localStorage.getItem('jtimer-theme'); } catch (x) {}
        if (t !== 'dark' && t !== 'light') {
            try {
                var p = new URLSearchParams(location.search).get('theme');
                if (p === 'dark' || p === 'light') t = p;
            } catch (x) {}
        }
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 両テーマとも「夜から始まって明けていく」ので、CSS側は夜の値を初期値として持つ。
           進行に合わせた実際の色は JS が上書きする */

        /* ライト：黒っぽい青の夜 → 朝焼け → 明るい青空 */
        :root {
            --page:      #fff;      /* 枠外。Notionのページ色に合わせる */
            --card-init: #0f1a2e;
            --edge:      rgba(188, 214, 240, 0.20);
            --edge-str:  rgba(188, 214, 240, 0.32);
            --inner:     rgba(13, 22, 38, 0.46);
            --track:     rgba(219, 232, 248, 0.22);
            --accent:    #ffc07a;
            --accent-2:  #ff9270;
            --fg:        #f2f6ff;
            --fg-mute:   #c9d6ea;
            --btn:       #eaf1fb;
            --btn-fg:    #16243a;
            --input-bg:  rgba(232, 240, 251, 0.10);
            --hover:     rgba(200, 220, 245, 0.11);
            --sw:        #7d8ea6;
        }
        /* ダーク：夜の青 → 朝焼け → 白い朝 */
        html[data-theme="dark"] {
            --page:      #191919;   /* Notionダークのページ背景と同じ色 */
            --card-init: #0d1220;
            --edge:      rgba(255, 195, 155, 0.16);
            --edge-str:  rgba(255, 195, 155, 0.28);
            --inner:     rgba(45, 14, 2, 0.46);
            --track:     rgba(255, 230, 205, 0.20);
            --accent:    #ffc07a;
            --accent-2:  #ff9270;
            --fg:        #fff6ef;
            --fg-mute:   #f0d9c8;
            --btn:       #f7e8db;
            --btn-fg:    #2a1a11;
            --input-bg:  rgba(255, 240, 225, 0.09);
            --hover:     rgba(255, 220, 190, 0.11);
            --sw:        #96796a;
        }

        /* iframeの地色は既定が白なので、必ず塗る */
        html { background: var(--page); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: var(--page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 空はこのカードの中に描く。枠外はNotionの色のまま */
        .jt-card {
            position: relative;
            z-index: 0; /* 内壁を空の上・中身の下に置くための重ね順の起点 */
            background: var(--card-init);
            box-shadow: var(--inset);
            border: 1px solid var(--edge);
            border-radius: 12px;
            padding: 1rem 1.75rem;
            display: flex;
            align-items: center;
            gap: 1.75rem;
            transition: background 2s ease;
            width: 100%;
            max-width: 680px;
        }

        /* 内壁。空の上に重ねて、盤面が窪んで見えるようにする */
        .jt-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: inherit;
            pointer-events: none;
            background: var(--rim);
        }

        .jt-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: conic-gradient(var(--accent-2) 0deg, var(--accent) 0deg, var(--track) 0deg);
        }

        .jt-inner {
            width: 60px;
            height: 60px;
            background: var(--inner);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--edge);
        }

        .jt-time {
            font-size: 16px;
            font-weight: 500;
            color: var(--fg);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .jt-mid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .jt-phase {
            font-size: 11px;
            color: var(--fg-mute);
            line-height: 1.4;
        }

        .jt-divider {
            width: 1px;
            height: 24px;
            background: var(--edge-str);
            flex-shrink: 0;
        }

        .jt-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .jt-sel {
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }

        .jt-label {
            font-size: 11px;
            color: var(--fg-mute);
            white-space: nowrap;
        }

        .jt-input {
            width: 44px;
            font-size: 12px;
            text-align: center;
            padding: 3px 5px;
            border: 1px solid var(--edge-str);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--fg);
            font-family: inherit;
        }

        .jt-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .jt-start {
            background: var(--btn);
            color: var(--btn-fg);
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 18px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .jt-start:hover { opacity: 0.82; }
        .jt-start:active { transform: scale(0.97); }

        .jt-mini {
            background: none;
            border: 1px solid var(--edge-str);
            border-radius: 5px;
            font-size: 11px;
            color: var(--fg-mute);
            padding: 4px 9px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .jt-mini:hover { background: var(--hover); }

        /* ライト・ダークの切り替えスイッチ */
        .jt-tg {
            position: relative;
            width: 30px;
            height: 17px;
            margin-left: 4px;
            padding: 0;
            flex-shrink: 0;
            border: 1px solid var(--sw);
            border-radius: 9px;
            background: none;
            cursor: pointer;
            opacity: 0.5;
            -webkit-appearance: none;
            appearance: none;
        }
        .jt-tg:hover, .jt-tg:focus-visible { opacity: 1; }
        .jt-tg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .jt-tg i {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--sw);
            transition: transform 0.22s cubic-bezier(0.3, 0.9, 0.4, 1);
        }
        html[data-theme="dark"] .jt-tg i { transform: translateX(13px); }

        /* 夜 → 朝 の反転は一瞬で切り替わる。見た目だけこの時間をかけて渡す */
        .jt-time, .jt-phase, .jt-label { transition: color .8s ease; }
        .jt-inner, .jt-divider { transition: background .8s ease, border-color .8s ease; }
        .jt-start, .jt-mini, .jt-input, .jt-tg {
            transition: background .8s ease, color .8s ease, border-color .8s ease, opacity .18s, transform .1s;
        }

        @media (prefers-reduced-motion: reduce) {
            .jt-tg i, .jt-card { transition: none; }
        }
    </style>
</head>
<body>

<div class="jt-card" id="jt-card">

    <div class="jt-ring" id="jt-ring">
        <div class="jt-inner">
            <span class="jt-time" id="jt-time">10:00</span>
        </div>
    </div>

    <div class="jt-mid">
        <div class="jt-phase" id="jt-phase">深呼吸をして準備を整えましょう</div>
    </div>

    <div class="jt-divider"></div>

    <div class="jt-right">
        <div class="jt-sel" id="jt-sel">
            <input type="number" class="jt-input" id="jt-input" value="10" min="1" max="60" onchange="jtUpdate()">
            <span class="jt-label">分</span>
        </div>
        <button class="jt-start" onclick="jtStart()">スタート</button>
        <button class="jt-mini" onclick="jtStop()">ストップ</button>
        <button class="jt-mini" onclick="jtReset()">リセット</button>
        <button class="jt-tg" id="jt-tg" type="button" role="switch" aria-checked="true" aria-label="ライト・ダークの切り替え"><i></i></button>
    </div>

</div>

<script>
    let jt_iv, jt_rem = 600, jt_run = false, jt_total = 600;
    const $ = id => document.getElementById(id);
    const root = document.documentElement;
    const isDark = () => root.getAttribute('data-theme') !== 'light';

    // 空の色。下から光が上がる放射グラデーションで、4段階を進行に合わせて渡っていく。
    // stops は [地平線の光, 空] の組。
    const SKY = {
        // 夜の青 → 地平線が色づく → 朝焼け → 白い朝
        dark: {
            pos: '145% 125% at 50% 122%',
            ringFrom: ['#ff9270', '#ffc07a'], ringTo: ['#e0431f', '#ef7d12'],
            stops: [['#24314f', '#0d1220'], ['#8a3c34', '#1c2242'], ['#d4620e', '#6a4a58'], ['#ff9a24', '#ffffff']]
        },
        // 黒っぽい青 → 地平線がオレンジ → 朝焼け → 明るい青空
        light: {
            pos: '150% 128% at 50% 124%', uiBlue: true,
            ringFrom: ['#ff9270', '#ffc07a'], ringTo: ['#d43a22', '#ee6f0a'],
            stops: [['#1e3358', '#0f1a2e'], ['#c25a2a', '#26365e'], ['#ff8231', '#8f86ab'], ['#ffd9a0', '#7fc0f2']]
        }
    };

    // 夜 → 朝 でUI側も入れ替える。[夜の色, 朝の色]、透明度つきは [色, 透明度]
    const UI = {
        // 白い朝に着地する側。文字は暖色の黒
        dark: {
            '--fg':      ['#fff6ef', '#2b1a10'],
            '--fg-mute': ['#f0d9c8', '#6b4a34'],
            '--btn':     ['#f7e8db', '#2b1a10'],
            '--btn-fg':  ['#2a1a11', '#fff3e6'],
            '--edge':    [['#ffc39b', 0.16], ['#6b3a14', 0.24]],
            '--edge-str':[['#ffc39b', 0.28], ['#6b3a14', 0.34]],
            '--track':   [['#ffe6cd', 0.20], ['#6b3a14', 0.20]],
            '--inner':   [['#2d0e02', 0.46], ['#ffffff', 0.62]],
            '--input-bg':[['#fff0e1', 0.09], ['#ffffff', 0.55]],
            '--sw':      ['#96796a', '#b09480']
        },
        // 青空に着地する側。暖色の文字だと濁るので、青寄りの黒にする
        light: {
            '--fg':      ['#f2f6ff', '#16243a'],
            '--fg-mute': ['#c9d6ea', '#485971'],
            '--btn':     ['#eaf1fb', '#16243a'],
            '--btn-fg':  ['#16243a', '#f2f6ff'],
            '--edge':    [['#bcd6f0', 0.20], ['#204066', 0.24]],
            '--edge-str':[['#bcd6f0', 0.32], ['#204066', 0.34]],
            '--track':   [['#dbe8f8', 0.22], ['#204066', 0.20]],
            '--inner':   [['#0d1626', 0.46], ['#ffffff', 0.66]],
            '--input-bg':[['#e8f0fb', 0.10], ['#ffffff', 0.60]],
            '--sw':      ['#7d8ea6', '#8fa3bb']
        }
    };

    const FLIP = 0.66; // 文字とボタンを反転させる進捗

    function jtFmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

    function lerp(c1, c2, f) {
        const h1 = c1.replace('#', ''), h2 = c2.replace('#', '');
        return '#' + [0, 2, 4].map(i => {
            const v = Math.round(parseInt(h1.substr(i, 2), 16) + (parseInt(h2.substr(i, 2), 16) - parseInt(h1.substr(i, 2), 16)) * f);
            return v.toString(16).padStart(2, '0');
        }).join('');
    }

    function rgba(hex, a) {
        const h = hex.replace('#', '');
        return 'rgba(' + parseInt(h.substr(0, 2), 16) + ',' + parseInt(h.substr(2, 2), 16) + ',' + parseInt(h.substr(4, 2), 16) + ',' + a.toFixed(3) + ')';
    }

    // 進行に合わせて4段階を渡る。i段目とi+1段目の間を lp で混ぜる
    function jtStage(p) {
        const s = SKY[isDark() ? 'dark' : 'light'].stops;
        let i, lp;
        if (p <= 0.33) { i = 0; lp = p / 0.33; }
        else if (p <= 0.66) { i = 1; lp = (p - 0.33) / 0.33; }
        else { i = 2; lp = (p - 0.66) / 0.34; }
        return [lerp(s[i][0], s[i + 1][0], lp), lerp(s[i][1], s[i + 1][1], lp)];
    }

    function jtSky(p) {
        const set = SKY[isDark() ? 'dark' : 'light'];
        const c = jtStage(p);
        return 'radial-gradient(' + set.pos + ',' + c[0] + ' 0%,' + lerp(c[0], c[1], 0.55) + ' 42%,' + c[1] + ' 100%)';
    }

    // 進んだぶんの弧。夜は淡い日輪、朝は空に負けないよう濃いオレンジへ
    function jtRing(deg, d) {
        const set = SKY[isDark() ? 'dark' : 'light'];
        const a2 = lerp(set.ringFrom[0], set.ringTo[0], d);
        const a1 = lerp(set.ringFrom[1], set.ringTo[1], d);
        return 'conic-gradient(' + a2 + ' 0deg, ' + a1 + ' ' + deg + 'deg, ' + getComputedStyle(root).getPropertyValue('--track').trim() + ' ' + deg + 'deg)';
    }

    // 内壁。夜は白い光、朝は黒い影。d で両者をクロスフェードさせる
    function jtRim(d) {
        const shape = [[0.26, 0.08, 7, 18], [0.14, 0.04, 6, 15], [0.12, 0, 4, 4], [0.12, 0, 4, 4]];
        const dirs = ['180deg', '0deg', '90deg', '270deg'];
        const layer = (col, scale) => shape.map((o, i) =>
            'linear-gradient(' + dirs[i] + ',' + rgba(col, o[0] * scale) + ' 0%,' + rgba(col, o[1] * scale) + ' ' + o[2] + '%,' + rgba(col, 0) + ' ' + o[3] + '%)').join(',');
        return layer('#fff0de', 1 - d) + ',' + layer('#3a2408', d * 0.8);
    }

    // 夜 → 朝 でUI全体を入れ替える。u は文字の反転（一瞬）、d は陰影（なだらか）
    function jtDayUI(u, d) {
        const map = UI[isDark() ? 'dark' : 'light'];
        for (const k in map) {
            const v = map[k];
            root.style.setProperty(k, Array.isArray(v[0])
                ? rgba(lerp(v[0][0], v[1][0], u), v[0][1] + (v[1][1] - v[0][1]) * u)
                : lerp(v[0], v[1], u));
        }
        root.style.setProperty('--rim', jtRim(d));
        root.style.setProperty('--inset',
            'inset 0 3px 12px ' + rgba('#fff0de', 0.16 * (1 - d)) + ', inset 0 3px 10px ' + rgba('#3a2408', 0.14 * d));
    }

    // 今のテーマ・今の進捗で塗り直す（カウントは進めない）
    function jtPaint() {
        const p = (jt_total - jt_rem) / jt_total;
        const d = Math.pow(p, 1.35); // 空はなだらかに明ける
        jtDayUI(p >= FLIP ? 1 : 0, d);
        $('jt-time').textContent = jtFmt(jt_rem);
        $('jt-ring').style.background = jtRing(p * 360, d);
        $('jt-card').style.background = jtSky(p);
    }

    function jtUpdate() {
        if (!jt_run) { jt_total = (parseInt($('jt-input').value) || 10) * 60; jt_rem = jt_total; jtPaint(); }
    }

    function jtDraw() {
        jtPaint();
        if (!jt_run) return;
        const p = (jt_total - jt_rem) / jt_total;
        $('jt-phase').textContent = ['心を静めて、思考を整理しましょう', '自由に思考を流れるままに表現してください', '深い洞察や気づきを大切に記録しましょう', 'もうすぐ完了です。最後の思考をまとめましょう'][p < 0.25 ? 0 : p < 0.5 ? 1 : p < 0.75 ? 2 : 3];
    }

    function jtStart() {
        if (!jt_run) {
            jt_run = true;
            $('jt-input').disabled = true;
            const s = $('jt-sel'); s.style.opacity = '0.35'; s.style.pointerEvents = 'none';
            jt_iv = setInterval(() => { jt_rem--; jtDraw(); if (jt_rem <= 0) jtComplete(); }, 1000);
            jtDraw();
        }
    }

    function jtStop() {
        if (jt_run) {
            jt_run = false;
            clearInterval(jt_iv);
            $('jt-phase').textContent = '一時停止中 — スタートで再開';
        }
    }

    function jtReset() {
        jt_run = false; clearInterval(jt_iv);
        $('jt-input').disabled = false;
        const s = $('jt-sel'); s.style.opacity = '1'; s.style.pointerEvents = 'auto';
        jt_total = (parseInt($('jt-input').value) || 10) * 60; jt_rem = jt_total;
        $('jt-phase').textContent = '深呼吸をして準備を整えましょう';
        jtPaint();
    }

    function jtComplete() {
        jt_run = false; clearInterval(jt_iv);
        $('jt-phase').textContent = 'お疲れさまでした。素晴らしいジャーナリングでした';
        const s = $('jt-sel'); s.style.opacity = '1'; s.style.pointerEvents = 'auto';
        $('jt-input').disabled = false;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [440, 523.25, 659.25, 783.99].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.setValueAtTime(f, ctx.currentTime); o.type = 'sine';
                const d = i * 0.15, v = 0.08 - i * 0.015;
                g.gain.setValueAtTime(0, ctx.currentTime + d);
                g.gain.linearRampToValueAtTime(v, ctx.currentTime + d + 0.2);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 2.5);
                o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 2.5);
            });
        } catch (e) {}
    }

    // テーマ切り替え。選んだ結果は次に開いたときも残す
    function jtMarkTheme() {
        $('jt-tg').setAttribute('aria-checked', isDark() ? 'true' : 'false');
        $('jt-tg').title = isDark() ? 'ライトモードにする' : 'ダークモードにする';
    }

    $('jt-tg').addEventListener('click', () => {
        root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
        jtMarkTheme();
        try { localStorage.setItem('jtimer-theme', isDark() ? 'dark' : 'light'); } catch (x) {}
        jtPaint(); // カウントは止めず、今の進捗のまま新しいテーマの色で塗り直す
    });

    jtMarkTheme();
    jtPaint();
</script>

</body>
</html>
